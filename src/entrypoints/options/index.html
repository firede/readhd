<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>readhd 设置</title>
    <style>
      body {
        font-family: system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif;
        max-width: 560px;
        margin: 32px auto;
        padding: 0 16px;
        color: #1a1a1a;
      }
      h1 {
        font-size: 20px;
      }
      .field {
        margin: 16px 0;
      }
      .field label {
        display: block;
        margin-bottom: 6px;
        font-weight: 600;
      }
      .field input {
        width: 100%;
        box-sizing: border-box;
        padding: 10px;
        font-size: 15px;
        border: 1px solid #ccc;
        border-radius: 8px;
      }
      button {
        min-height: 44px;
        padding: 0 18px;
        font-size: 15px;
        border-radius: 8px;
        border: 1px solid #ccc;
        background: #f5f5f5;
        cursor: pointer;
      }
      #result {
        margin-top: 16px;
        padding: 12px;
        background: #f8f8f8;
        border-radius: 8px;
        white-space: pre-wrap;
        word-break: break-all;
        font-size: 14px;
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
