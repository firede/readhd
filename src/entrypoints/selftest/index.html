<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>阅读自测</title>
    <style>
      body {
        margin: 0;
        font-family: system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif;
        color: #1a1a1a;
        background: #fff;
      }
      .wrap {
        max-width: 720px;
        margin: 0 auto;
        padding: 32px 20px;
      }
      h1 {
        font-size: 26px;
      }
      .passage {
        font-size: 22px;
        line-height: 1.8;
      }
      button.big {
        min-height: 56px;
        padding: 0 28px;
        font-size: 20px;
        border-radius: 12px;
        border: 1px solid #ccc;
        background: #f5f5f5;
        cursor: pointer;
      }
      button.primary {
        background: #1e40af;
        border-color: #1e40af;
        color: #fff;
      }
      .options button {
        display: block;
        width: 100%;
        text-align: left;
        margin: 10px 0;
        min-height: 56px;
        font-size: 20px;
        border-radius: 12px;
        border: 1px solid #ccc;
        background: #fff;
        cursor: pointer;
        padding: 10px 16px;
      }
      .q {
        font-size: 22px;
        margin-bottom: 8px;
      }
      .muted {
        color: #777;
      }
      table {
        border-collapse: collapse;
        margin: 12px 0;
      }
      td,
      th {
        border: 1px solid #ddd;
        padding: 8px 14px;
        font-size: 17px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
